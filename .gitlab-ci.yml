variables:
  ZIG_VERSION: '0.15.2'

include:
  # Build
  - component: gitlab.com/devnw/ci-catalog/zig-build@v1.9.3
    inputs:
      stage: build
      zig_version: '0.15.2'

  # Test - unit tests via component
  - component: gitlab.com/devnw/ci-catalog/zig-test@v1.9.3
    inputs:
      stage: test
      zig_version: '0.15.2'

  # Format checking
  - component: gitlab.com/devnw/ci-catalog/zig-format@v1.9.3
    inputs:
      stage: test
      zig_version: '0.15.2'
      paths: 'src/ tests/ build.zig'

  # Security scanning
  - component: gitlab.com/devnw/ci-catalog/security-sast@v1.9.3
    inputs:
      stage: security
  - component: gitlab.com/devnw/ci-catalog/security-dependency-scanning@v1.9.3
    inputs:
      stage: security
  - component: gitlab.com/devnw/ci-catalog/security-secrets@v1.9.3
    inputs:
      stage: security
  - component: gitlab.com/devnw/ci-catalog/security-gitleaks@v1.9.3

  # SBOM generation and scanning
  - component: gitlab.com/devnw/ci-catalog/sbom-generate@v1.9.3
  - component: gitlab.com/devnw/ci-catalog/sbom-scan@v1.9.3
    inputs:
      allow_failure: true

  # Release creation
  - component: gitlab.com/devnw/ci-catalog/release-semantic@v1.9.3
    inputs:
      stage: release

default:
  tags:
    - company
    - linux

stages:
  - build
  - test
  - security
  - sbom
  - release

# =============================================================================
# Additional Test Jobs (specialized tests not covered by zig-test component)
# =============================================================================

.zig-test-base:
  stage: test
  image: ubuntu:24.04
  cache:
    key: "linux-zig-${ZIG_VERSION}"
    paths:
      - zig-${ZIG_VERSION}/
  before_script:
    - apt-get update && apt-get install -y curl xz-utils
    - |
      if [ ! -f "zig-${ZIG_VERSION}/zig" ]; then
        ARCHIVE_NAME="zig-x86_64-linux-${ZIG_VERSION}"
        curl -L "https://ziglang.org/download/${ZIG_VERSION}/${ARCHIVE_NAME}.tar.xz" | tar -xJ
        mv "${ARCHIVE_NAME}" "zig-${ZIG_VERSION}"
      fi
    - export PATH="$PWD/zig-${ZIG_VERSION}:$PATH"
    - zig version

test:acceptance:
  extends: .zig-test-base
  script:
    - export PATH="$PWD/zig-${ZIG_VERSION}:$PATH"
    - zig build test-accept --summary all

test:edge-cases:
  extends: .zig-test-base
  script:
    - export PATH="$PWD/zig-${ZIG_VERSION}:$PATH"
    - zig build test-data --summary all

test:json-schema-suite:
  extends: .zig-test-base
  before_script:
    - apt-get update && apt-get install -y curl xz-utils git
    - |
      if [ ! -f "zig-${ZIG_VERSION}/zig" ]; then
        ARCHIVE_NAME="zig-x86_64-linux-${ZIG_VERSION}"
        curl -L "https://ziglang.org/download/${ZIG_VERSION}/${ARCHIVE_NAME}.tar.xz" | tar -xJ
        mv "${ARCHIVE_NAME}" "zig-${ZIG_VERSION}"
      fi
    - export PATH="$PWD/zig-${ZIG_VERSION}:$PATH"
    - zig version
    # Fetch JSON Schema Test Suite from GitHub (external data source)
    - git clone --depth 1 https://github.com/json-schema-org/JSON-Schema-Test-Suite.git testdata/JSON-Schema-Test-Suite
  script:
    - export PATH="$PWD/zig-${ZIG_VERSION}:$PATH"
    - zig build test-schema --summary all
