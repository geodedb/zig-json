# SPDX-License-Identifier: Apache-2.0
# Copyright (c) 2024-2025 CodePros

include:
  # Security scanning (Advanced SAST enabled by default)
  - component: gitlab.com/devnw/ci-catalog/security-sast@v1.7.1
    inputs:
      stage: security
  - component: gitlab.com/devnw/ci-catalog/security-dependency-scanning@v1.7.1
    inputs:
      stage: security
  - component: gitlab.com/devnw/ci-catalog/security-secrets@v1.7.1
    inputs:
      stage: security
  - component: gitlab.com/devnw/ci-catalog/security-gitleaks@v1.7.1

  # SBOM generation and scanning
  - component: gitlab.com/devnw/ci-catalog/sbom-generate@v1.7.1
  - component: gitlab.com/devnw/ci-catalog/sbom-scan@v1.7.1
    inputs:
      allow_failure: true

  # Release creation
  - component: gitlab.com/devnw/ci-catalog/release-semantic@v1.7.1
    inputs:
      stage: release

default:
  tags:
    - company
    - linux

stages:
  - build
  - test
  - security
  - sbom
  - release

# =============================================================================
# Build & Test
# =============================================================================

build:
  stage: build
  image: alpine:latest
  before_script:
    - apk add --no-cache curl xz
    # Install Zig
    - curl -L https://ziglang.org/download/0.14.0/zig-linux-x86_64-0.14.0.tar.xz | tar -xJ
    - mv zig-linux-x86_64-0.14.0 /opt/zig
    - export PATH="/opt/zig:$PATH"
  script:
    - export PATH="/opt/zig:$PATH"
    - zig build
  artifacts:
    paths:
      - zig-out/
      - .zig-cache/
    expire_in: 1 hour

test:unit:
  stage: test
  image: alpine:latest
  needs: [build]
  before_script:
    - apk add --no-cache curl xz
    - curl -L https://ziglang.org/download/0.14.0/zig-linux-x86_64-0.14.0.tar.xz | tar -xJ
    - mv zig-linux-x86_64-0.14.0 /opt/zig
    - export PATH="/opt/zig:$PATH"
  script:
    - export PATH="/opt/zig:$PATH"
    - zig build test

test:acceptance:
  stage: test
  image: alpine:latest
  needs: [build]
  before_script:
    - apk add --no-cache curl xz
    - curl -L https://ziglang.org/download/0.14.0/zig-linux-x86_64-0.14.0.tar.xz | tar -xJ
    - mv zig-linux-x86_64-0.14.0 /opt/zig
    - export PATH="/opt/zig:$PATH"
  script:
    - export PATH="/opt/zig:$PATH"
    - zig build test-accept

test:edge-cases:
  stage: test
  image: alpine:latest
  needs: [build]
  before_script:
    - apk add --no-cache curl xz
    - curl -L https://ziglang.org/download/0.14.0/zig-linux-x86_64-0.14.0.tar.xz | tar -xJ
    - mv zig-linux-x86_64-0.14.0 /opt/zig
    - export PATH="/opt/zig:$PATH"
  script:
    - export PATH="/opt/zig:$PATH"
    - zig build test-data

test:json-schema-suite:
  stage: test
  image: alpine:latest
  needs: [build]
  before_script:
    - apk add --no-cache curl xz git
    - curl -L https://ziglang.org/download/0.14.0/zig-linux-x86_64-0.14.0.tar.xz | tar -xJ
    - mv zig-linux-x86_64-0.14.0 /opt/zig
    - export PATH="/opt/zig:$PATH"
    # Fetch JSON Schema Test Suite from GitHub (external data source)
    - git clone --depth 1 https://github.com/json-schema-org/JSON-Schema-Test-Suite.git testdata/JSON-Schema-Test-Suite
  script:
    - export PATH="/opt/zig:$PATH"
    - zig build test-schema

